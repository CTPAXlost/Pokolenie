name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SINGBOX_TAG: v1.11.15
    steps:
      - name: Cache libbox.aar
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: libbox-cache/libbox.aar
          key: libbox-${{ env.SINGBOX_TAG }}-gvisor-wg-utls-v1

      - name: Set up Go
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up JDK 17
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages + NDK
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            :
          else
            for ndk in "ndk;27.0.12077973" "ndk;26.1.10909125" "ndk;25.2.9519653"; do
              if sdkmanager "$ndk"; then
                ver="${ndk#ndk;}"
                export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ver"
                break
              fi
            done
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          test -d "$ANDROID_NDK_HOME"

      - name: Install gomobile (sagernet)
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Clone and build sing-box libbox
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_NDK_HOME:-}" ] && [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          fi
          git clone --depth 1 --branch "$SINGBOX_TAG" https://github.com/SagerNet/sing-box.git
          cd sing-box
          gomobile bind -v -androidapi 26 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            ./experimental/libbox
          if [ -f box.aar ]; then mv -f box.aar libbox.aar; fi
          mkdir -p ../libbox-cache
          cp libbox.aar ../libbox-cache/libbox.aar
          ls -lh ../libbox-cache/libbox.aar

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox-cache/libbox.aar
          retention-days: 5

  build:
    name: Build APK
    needs: build-libbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download libbox.aar
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew && ls -lh app/libs

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" "dist/Pokolenie-${{ github.sha }}-debug.apk"
          cp "$RELEASE_APK" "dist/Pokolenie-${{ github.sha }}-release-unsigned.apk"
          ls -lh dist app/libs

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pokolenie-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: pokolenie-apk
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
